<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Racetrack Darts</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #00adb5;
      --text-color: #eeeeee;
      --text-muted: #888888;
      --completed-color: #2e7d32;
      --active-color: #d32f2f;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    h1 {
      text-align: center;
      color: var(--accent-color);
      margin-bottom: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .setup-section {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #fff;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 4px;
      background-color: var(--accent-color);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      background-color: #444;
      cursor: not-allowed;
      opacity: 0.5;
    }

    .banner {
      font-size: 1.2rem;
      font-weight: bold;
      text-align: center;
      padding: 10px;
      background: #2a2a2a;
      border-radius: 4px;
      margin-bottom: 15px;
    }

    .segments-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 10px;
      margin-bottom: 15px;
    }

    .seg-box {
      background: #2a2a2a;
      padding: 10px;
      border-radius: 4px;
      text-align: center;
      border: 2px solid transparent;
    }

    .seg-box.completed {
      background: var(--completed-color);
    }

    .seg-title {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .seg-req {
      font-weight: bold;
      font-size: 0.9rem;
      margin-top: 5px;
    }

    .turn-info {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 15px;
      background: #252525;
      padding: 10px;
      border-radius: 4px;
    }

    .dart-boxes {
      display: flex;
      gap: 10px;
    }

    .dart-box {
      width: 40px;
      height: 40px;
      border: 1px solid var(--accent-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      border-radius: 4px;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 15px;
    }

    .modifiers {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .mod-btn {
      flex: 1;
      background: #333;
    }

    .mod-btn.active {
      background: var(--accent-color);
    }

    .color-section {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .color-btn {
      flex: 1;
      padding: 12px;
      border-radius: 4px;
      font-weight: bold;
    }

    .color-red { background: #d32f2f; color: white; }
    .color-green { background: #388e3c; color: white; }
    .color-black { background: #000; color: white; border: 1px solid #444; }
    .color-white { background: #fff; color: black; }

    .action-row {
      display: flex;
      gap: 10px;
    }

    .action-row button {
      flex: 1;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>RACETRACK DARTS</h1>

  <!-- SETUP SECTION -->
  <div id="setup-card" class="card">
    <h3>Add Players</h3>
    <div class="setup-section">
      <input type="text" id="player-name-input" placeholder="Player Name">
      <button id="btn-add-player">Add Player</button>
    </div>
    <ul id="player-list"></ul>
    <button id="btn-start-game" style="width: 100%; margin-top: 10px;" disabled>Start Game</button>
  </div>

  <!-- GAME INTERFACE -->
  <div id="game-card" class="card hidden">
    <div id="active-player-banner" class="banner">PLAYER 1'S TURN (SEGMENT 1)</div>

    <div class="segments-grid">
      <div id="seg-1" class="seg-box">
        <div class="seg-title">Segment 1</div>
        <div id="seg-req-1" class="seg-req">30 Pts</div>
      </div>
      <div id="seg-2" class="seg-box">
        <div class="seg-title">Segment 2</div>
        <div id="seg-req-2" class="seg-req">51 Pts</div>
      </div>
      <div id="seg-3" class="seg-box">
        <div class="seg-title">Segment 3</div>
        <div id="seg-req-3" class="seg-req">75+ Pts</div>
      </div>
      <div id="seg-4" class="seg-box">
        <div class="seg-title">Segment 4</div>
        <div id="seg-req-4" class="seg-req">Color Hit</div>
      </div>
      <div id="seg-5" class="seg-box">
        <div class="seg-title">Segment 5</div>
        <div id="seg-req-5" class="seg-req">130 (6 Darts)</div>
      </div>
      <div id="seg-6" class="seg-box">
        <div class="seg-title">Segment 6</div>
        <div id="seg-req-6" class="seg-req">170 (9 Darts)</div>
      </div>
    </div>

    <div class="turn-info">
      <div>Round: <span id="round-num">1</span></div>
      <div class="dart-boxes">
        <div id="dart-1" class="dart-box">-</div>
        <div id="dart-2" class="dart-box">-</div>
        <div id="dart-3" class="dart-box">-</div>
      </div>
      <div>Turn Total: <span id="turn-total">0</span></div>
    </div>

    <div class="modifiers">
      <button id="btn-double" class="mod-btn">DOUBLE</button>
      <button id="btn-triple" class="mod-btn">TRIPLE</button>
    </div>

    <!-- NUMBER KEYPAD (1-20 + Bull) -->
    <div class="keypad">
      <button class="num-btn" data-val="1">1</button>
      <button class="num-btn" data-val="2">2</button>
      <button class="num-btn" data-val="3">3</button>
      <button class="num-btn" data-val="4">4</button>
      <button class="num-btn" data-val="5">5</button>
      <button class="num-btn" data-val="6">6</button>
      <button class="num-btn" data-val="7">7</button>
      <button class="num-btn" data-val="8">8</button>
      <button class="num-btn" data-val="9">9</button>
      <button class="num-btn" data-val="10">10</button>
      <button class="num-btn" data-val="11">11</button>
      <button class="num-btn" data-val="12">12</button>
      <button class="num-btn" data-val="13">13</button>
      <button class="num-btn" data-val="14">14</button>
      <button class="num-btn" data-val="15">15</button>
      <button class="num-btn" data-val="16">16</button>
      <button class="num-btn" data-val="17">17</button>
      <button class="num-btn" data-val="18">18</button>
      <button class="num-btn" data-val="19">19</button>
      <button class="num-btn" data-val="20">20</button>
      <button class="num-btn" data-val="25" style="grid-column: span 2;">BULL</button>
      <button id="btn-miss" style="grid-column: span 3; background: #555;">MISS (0)</button>
    </div>

    <!-- COLOR SELECTION (For Segment 4) -->
    <div class="color-section">
      <button class="color-btn color-red" data-color="Red">RED</button>
      <button class="color-btn color-green" data-color="Green">GREEN</button>
      <button class="color-btn color-black" data-color="Black">BLACK</button>
      <button class="color-btn color-white" data-color="White">WHITE</button>
    </div>

    <div class="action-row">
      <button id="btn-undo" style="background: #e65100;">UNDO</button>
      <button id="btn-advance" disabled>ADVANCE TURN</button>
    </div>
  </div>
</div>

<script>
  // Game State
  let players = [];
  let currentPlayerIndex = 0;
  let currentRound = 1;
  let isDouble = false;
  let isTriple = false;
  let historyStack = [];

  // DOM Elements
  const setupCard = document.getElementById('setup-card');
  const gameCard = document.getElementById('game-card');
  const playerNameInput = document.getElementById('player-name-input');
  const btnAddPlayer = document.getElementById('btn-add-player');
  const playerList = document.getElementById('player-list');
  const btnStartGame = document.getElementById('btn-start-game');

  const activePlayerBanner = document.getElementById('active-player-banner');
  const roundNumDisplay = document.getElementById('round-num');
  const turnTotalScoreDisplay = document.getElementById('turn-total');
  const btnAdvanceTurn = document.getElementById('btn-advance');
  const btnDouble = document.getElementById('btn-double');
  const btnTriple = document.getElementById('btn-triple');
  const btnMiss = document.getElementById('btn-miss');
  const btnUndo = document.getElementById('btn-undo');
  const colorButtons = document.querySelectorAll('.color-btn');

  // Setup Handlers
  btnAddPlayer.addEventListener('click', () => {
    const name = playerNameInput.value.trim();
    if (name) {
      players.push({
        name: name,
        segment: 1,
        segmentProgress: 0,
        dartsInSegment: 0,
        currentTurnDarts: [],
        currentTurnScores: [],
        completedSegmentThisTurn: false,
        roundsCount: 0
      });
      playerNameInput.value = '';
      renderPlayerList();
    }
  });

  function renderPlayerList() {
    playerList.innerHTML = players.map(p => `<li>${p.name}</li>`).join('');
    btnStartGame.disabled = players.length === 0;
  }

  btnStartGame.addEventListener('click', () => {
    setupCard.classList.add('hidden');
    gameCard.classList.remove('hidden');
    updateUI();
  });

  // Modifier Handlers
  btnDouble.addEventListener('click', () => {
    isDouble = !isDouble;
    if (isDouble) isTriple = false;
    updateModifierUI();
  });

  btnTriple.addEventListener('click', () => {
    isTriple = !isTriple;
    if (isTriple) isDouble = false;
    updateModifierUI();
  });

  function updateModifierUI() {
    btnDouble.classList.toggle('active', isDouble);
    btnTriple.classList.toggle('active', isTriple);
  }

  // Keypad Scoring
  document.querySelectorAll('.num-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const baseVal = parseInt(btn.getAttribute('data-val'));
      let multiplier = 1;
      let label = baseVal.toString();

      if (isDouble) {
        multiplier = 2;
        label = 'D' + baseVal;
      } else if (isTriple) {
        if (baseVal === 25) return; // No Triple Bull
        multiplier = 3;
        label = 'T' + baseVal;
      }

      processDartThrow(baseVal * multiplier, label);
    });
  });

  btnMiss.addEventListener('click', () => {
    processDartThrow(0, 'M');
  });

  colorButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      const color = btn.getAttribute('data-color');
      processDartThrow(0, color, true);
    });
  });

  function processDartThrow(score, label, isColorHit = false) {
    saveState();
    const p = players[currentPlayerIndex];

    if (p.currentTurnDarts.length >= 3 || p.completedSegmentThisTurn) return;

    p.currentTurnDarts.push(label);
    p.currentTurnScores.push(score);
    p.dartsInSegment += 1;

    // Segment Logic with updated score targets
    if (p.segment === 1) {
      p.segmentProgress += score;
      if (p.segmentProgress === 30) {
        advanceSegment(p);
      } else if (p.segmentProgress > 30) {
        // Bust segment 1 progress
        p.segmentProgress = 0;
      }
    } else if (p.segment === 2) {
      p.segmentProgress += score;
      if (p.segmentProgress === 51) {
        advanceSegment(p);
      } else if (p.segmentProgress > 51) {
        // Bust segment 2 progress
        p.segmentProgress = 0;
      }
    } else if (p.segment === 3) {
      p.segmentProgress += score;
      if (p.segmentProgress >= 75) {
        advanceSegment(p);
      }
    } else if (p.segment === 4) {
      if (isColorHit) {
        advanceSegment(p);
      }
    } else if (p.segment === 5) {
      p.segmentProgress += score;
      if (p.segmentProgress === 130 && p.dartsInSegment <= 6) {
        advanceSegment(p);
      } else if (p.segmentProgress > 130 || p.dartsInSegment >= 6) {
        // Reset segment 5
        p.segmentProgress = 0;
        p.dartsInSegment = 0;
      }
    } else if (p.segment === 6) {
      p.segmentProgress += score;
      if (p.segmentProgress === 170 && p.dartsInSegment <= 9) {
        alert(`${p.name} WINS THE GAME!`);
        advanceSegment(p);
      } else if (p.segmentProgress > 170 || p.dartsInSegment >= 9) {
        // Reset segment 6
        p.segmentProgress = 0;
        p.dartsInSegment = 0;
      }
    }

    // Reset modifiers
    isDouble = false;
    isTriple = false;
    updateModifierUI();
    updateUI();
  }

  function advanceSegment(p) {
    p.segment += 1;
    p.segmentProgress = 0;
    p.dartsInSegment = 0;
    p.completedSegmentThisTurn = true;
  }

  btnAdvanceTurn.addEventListener('click', () => {
    saveState();
    const p = players[currentPlayerIndex];

    // Reset progress if exact target not hit for exact-score segments
    if (!p.completedSegmentThisTurn) {
      if (p.segment === 1 && p.segmentProgress !== 30) p.segmentProgress = 0;
      if (p.segment === 2 && p.segmentProgress !== 51) p.segmentProgress = 0;
      if (p.segment === 3 && p.segmentProgress < 75) p.segmentProgress = 0;
    }

    p.currentTurnDarts = [];
    p.currentTurnScores = [];
    p.completedSegmentThisTurn = false;
    p.roundsCount += 1;

    currentPlayerIndex++;
    if (currentPlayerIndex >= players.length) {
      currentPlayerIndex = 0;
      currentRound++;
    }

    updateUI();
  });

  function saveState() {
    historyStack.push(JSON.stringify({
      players,
      currentPlayerIndex,
      currentRound,
      isDouble,
      isTriple
    }));
  }

  btnUndo.addEventListener('click', () => {
    if (historyStack.length === 0) return;
    const state = JSON.parse(historyStack.pop());
    players = state.players;
    currentPlayerIndex = state.currentPlayerIndex;
    currentRound = state.currentRound;
    isDouble = state.isDouble;
    isTriple = state.isTriple;
    updateModifierUI();
    updateUI();
  });

  function updateUI() {
    const p = players[currentPlayerIndex];

    activePlayerBanner.innerText = `${p.name.toUpperCase()}'S TURN (SEGMENT ${p.segment})`;
    roundNumDisplay.innerText = currentRound;

    for (let i = 1; i <= 3; i++) {
      const box = document.getElementById(`dart-${i}`);
      box.innerText = p.currentTurnDarts[i - 1] || '-';
    }

    const totalTurnScore = p.currentTurnScores.reduce((a, b) => a + b, 0);
    turnTotalScoreDisplay.innerText = totalTurnScore;

    const turnComplete = p.currentTurnDarts.length === 3 || p.completedSegmentThisTurn;
    btnAdvanceTurn.disabled = !turnComplete;

    // Dynamic segment requirement text displays
    document.getElementById('seg-req-1').innerText = p.segment === 1 ? `Rem: ${30 - p.segmentProgress}` : `30 Pts`;
    document.getElementById('seg-req-2').innerText = p.segment === 2 ? `Rem: ${51 - p.segmentProgress}` : `51 Pts`;
    document.getElementById('seg-req-3').innerText = p.segment === 3 ? `Rem: ${Math.max(0, 75 - p.segmentProgress)}` : `75+ Pts`;
    document.getElementById('seg-req-5').innerText = p.segment === 5 ? `Rem: ${130 - p.segmentProgress}` : `130 (6 Darts)`;
    document.getElementById('seg-req-6').innerText = p.segment === 6 ? `Rem: ${170 - p.segmentProgress}` : `170 (9 Darts)`;

    for (let i = 1; i <= 6; i++) {
      const segEl = document.getElementById(`seg-${i}`);
      if (i < p.segment) {
        segEl.classList.add('completed');
      } else {
        segEl.classList.remove('completed');
      }
    }

    const isSeg4 = (p.segment === 4);
    const numBtns = document.querySelectorAll('.num-btn');
    numBtns.forEach(btn => btn.disabled = isSeg4 || turnComplete);
    btnDouble.disabled = isSeg4 || turnComplete;
    btnTriple.disabled = isSeg4 || turnComplete;
    btnMiss.disabled = turnComplete;

    colorButtons.forEach(btn => {
      btn.disabled = !isSeg4 || turnComplete;
      btn.style.opacity = (isSeg4 && !turnComplete) ? '1' : '0.2';
    });
  }
</script>
</body>
</html>
