<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Race Track Dart Game - Queensland</title>
    <style>
        :root {
            --bg-color: #1a1a1d;
            --card-bg: #2d2d30;
            --accent: #e50914;
            --accent-hover: #b20710;
            --text: #ffffff;
            --text-muted: #aaaaaa;
            --segment-complete: #4caf50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .hidden {
            display: none !important;
        }

        h1, h2, h3 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--accent);
        }

        .btn {
            background-color: var(--accent);
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn:disabled {
            background-color: #555 !important;
            color: #888;
            cursor: not-allowed;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #111;
            color: #fff;
            box-sizing: border-box;
        }

        /* TRACK DISPLAY STYLES */
        .track-container {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin: 20px 0;
        }

        .track-segment {
            flex: 1;
            background: #1e1e1e;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 10px 4px;
            text-align: center;
            transition: all 0.3s;
        }

        .track-segment.completed {
            background: var(--segment-complete);
            border-color: #81c784;
            box-shadow: 0 0 10px var(--segment-complete);
        }

        .track-segment .seg-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .track-segment .seg-req {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 1.2rem;
            border-bottom: 2px solid #444;
            padding-bottom: 10px;
        }

        .active-player-banner {
            font-size: 1.8rem;
            font-weight: bold;
            text-align: center;
            padding: 10px;
            background: #111;
            border-radius: 8px;
            margin-bottom: 15px;
            color: #ffeb3b;
        }

        .dart-display-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 15px 0;
        }

        .dart-display {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .dart-box {
            width: 70px;
            height: 40px;
            border: 2px dashed #666;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border-radius: 5px;
            background: #111;
        }

        .turn-total {
            font-weight: bold;
            font-size: 1.1rem;
            color: #ffeb3b;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-top: 15px;
        }

        .btn-pad {
            padding: 12px 5px;
            font-weight: bold;
            border-radius: 5px;
            border: none;
            background: #444;
            color: #fff;
            cursor: pointer;
        }

        .btn-pad:hover { background: #666; }
        .btn-pad.modifier { background: #0288d1; }
        .btn-pad.modifier.active { background: #00bcd4; box-shadow: 0 0 8px #00bcd4; }
        .btn-pad.color-white { background: #eee; color: #111; }
        .btn-pad.color-red { background: #d32f2f; color: #fff; }
        .btn-pad.color-green { background: #388e3c; color: #fff; }
        .btn-pad.color-black { background: #111; color: #fff; border: 1px solid #555; }

        .advance-btn {
            background: #388e3c;
            color: white;
            font-size: 1.1rem;
            padding: 15px;
            margin-top: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #444;
        }

        th {
            background: #111;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container">

    <!-- SETUP CARD -->
    <div id="setup-card" class="card">
        <h1>🏁 Race Track Dart Game 🏁</h1>
        <div class="form-group">
            <label>Player Names (Comma Separated):</label>
            <input type="text" id="player-names-input" placeholder="e.g. Alice, Bob, Charlie">
        </div>
        <div class="form-group">
            <label>Target Laps:</label>
            <input type="number" id="target-laps-input" min="1" max="10" value="3">
        </div>
        <button class="btn" onclick="startGame()">🚀 Start Game</button>
    </div>

    <!-- GAME CARD -->
    <div id="game-card" class="card hidden">
        <h2>🏁 Race Track #1 🏁</h2>
        <div class="game-header">
            <div>Round: <span id="rt-round-num">1</span></div>
            <div>Target Laps: <span id="rt-target-laps">3</span></div>
        </div>
        <div id="rt-active-banner" class="active-player-banner">PLAYER 1'S TURN</div>

        <h3>Current Lap Progress</h3>
        <div class="track-container">
            <div class="track-segment" id="rt-seg-1">
                <div class="seg-title">Seg 1</div>
                <div class="seg-req">25 Pts</div>
            </div>
            <div class="track-segment" id="rt-seg-2">
                <div class="seg-title">Seg 2</div>
                <div class="seg-req">40 Pts</div>
            </div>
            <div class="track-segment" id="rt-seg-3">
                <div class="seg-title">Seg 3</div>
                <div class="seg-req">60+ Pts</div>
            </div>
            <div class="track-segment" id="rt-seg-4">
                <div class="seg-title">Seg 4</div>
                <div class="seg-req">75+ Pts</div>
            </div>
            <div class="track-segment" id="rt-seg-5">
                <div class="seg-title">Seg 5</div>
                <div class="seg-req">110 Pts / 6 Darts</div>
            </div>
            <div class="track-segment" id="rt-seg-6">
                <div class="seg-title">Seg 6</div>
                <div class="seg-req">All 1 Color</div>
            </div>
        </div>

        <div class="dart-display-container">
            <div class="dart-display">
                <div class="dart-box" id="rt-dart-1">-</div>
                <div class="dart-box" id="rt-dart-2">-</div>
                <div class="dart-box" id="rt-dart-3">-</div>
            </div>
            <div class="turn-total">Turn Total: <span id="rt-turn-score">0</span></div>
        </div>

        <div class="controls-grid" id="rt-controls">
            <!-- Dynamic keypad controls based on active segment -->
        </div>

        <button class="btn advance-btn" id="rt-btn-advance" disabled onclick="advanceTurn()">Advance Turn ➡️</button>

        <h3 style="margin-top:25px;">Vertical Scoreboard</h3>
        <table>
            <thead>
                <tr>
                    <th>Score / Status</th>
                    <th id="player-headers">Players</th>
                </tr>
            </thead>
            <tbody id="vertical-scoreboard-body">
                <!-- Scores aligned in columns per player -->
            </tbody>
        </table>
    </div>

</div>

<script>
    const RACE_TRACK_SEGMENTS = [
        { id: 1, title: 'Seg 1', reqText: '25 Pts', targetScore: 25, type: 'points' },
        { id: 2, title: 'Seg 2', reqText: '40 Pts', targetScore: 40, type: 'points' },
        { id: 3, title: 'Seg 3', reqText: '60+ Pts', targetScore: 60, type: 'points_min' },
        { id: 4, title: 'Seg 4', reqText: '75+ Pts', targetScore: 75, type: 'points_min' },
        { id: 5, title: 'Seg 5', reqText: '110 Pts / 6 Darts', targetScore: 110, maxDarts: 6, type: 'multi_round_points' },
        { id: 6, title: 'Seg 6', reqText: 'All 1 Color', type: 'color_match' }
    ];

    let gameState = {
        targetLaps: 3,
        currentRound: 1,
        currentPlayerIndex: 0,
        players: [],
        darts: []
    };

    function startGame() {
        const input = document.getElementById('player-names-input').value;
        const playerNames = input.split(',').map(name => name.trim()).filter(name => name.length > 0);

        if (playerNames.length === 0) {
            alert('Please enter at least one player name!');
            return;
        }

        gameState.targetLaps = parseInt(document.getElementById('target-laps-input').value) || 3;
        gameState.currentRound = 1;
        gameState.currentPlayerIndex = 0;
        gameState.darts = [];

        gameState.players = playerNames.map(name => ({
            name: name,
            laps: 0,
            currentSegment: 1,
            seg5Progress: 0,
            seg5DartsUsed: 0
        }));

        document.getElementById('setup-card').classList.add('hidden');
        document.getElementById('game-card').classList.remove('hidden');

        document.getElementById('rt-target-laps').innerText = gameState.targetLaps;

        updateUI();
    }

    function updateUI() {
        const p = gameState.players[gameState.currentPlayerIndex];
        document.getElementById('rt-round-num').innerText = gameState.currentRound;
        document.getElementById('rt-active-banner').innerText = `${p.name.toUpperCase()}'S TURN`;

        // Update Track Segment visual state
        for (let i = 1; i <= 6; i++) {
            const segBox = document.getElementById(`rt-seg-${i}`);
            segBox.classList.toggle('completed', i < p.currentSegment);
        }

        // Render Vertical Scoreboard
        renderVerticalScoreboard();

        document.getElementById('rt-btn-advance').disabled = gameState.darts.length === 0;
    }

    function renderVerticalScoreboard() {
        const headerTr = document.getElementById('player-headers');
        headerTr.innerHTML = '';
        
        gameState.players.forEach(p => {
            const th = document.createElement('th');
            th.innerText = p.name;
            headerTr.appendChild(th);
        });

        const tbody = document.getElementById('vertical-scoreboard-body');
        tbody.innerHTML = '';

        // Row 1: Laps Completed
        let lapTr = document.createElement('tr');
        lapTr.innerHTML = `<td><strong>Laps Completed</strong></td>` + 
            gameState.players.map(p => `<td>${p.laps} / ${gameState.targetLaps}</td>`).join('');
        tbody.appendChild(lapTr);

        // Row 2: Current Segment
        let segTr = document.createElement('tr');
        segTr.innerHTML = `<td><strong>Current Segment</strong></td>` + 
            gameState.players.map(p => `<td>Seg ${p.currentSegment}</td>`).join('');
        tbody.appendChild(segTr);
    }

    function advanceTurn() {
        gameState.darts = [];
        gameState.currentPlayerIndex++;

        if (gameState.currentPlayerIndex >= gameState.players.length) {
            gameState.currentPlayerIndex = 0;
            gameState.currentRound++;
        }

        updateUI();
    }
</script>
</body>
</html>
